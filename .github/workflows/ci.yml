name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Coalesce PR label/synchronize events; preserve every main/batch SHA's receipt.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      brain_bar: ${{ steps.filter.outputs.brain_bar }}
      launchd: ${{ steps.filter.outputs.launchd }}
      crash_sweeps: ${{ steps.sweeps.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select exhaustive crash sweep
        id: sweeps
        run: python3 scripts/ci/crash_sweep_gate.py required

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            brain_bar:
              - 'brain-bar/**'
              - 'scripts/launchd/**'
            launchd:
              - 'scripts/launchd/**'
              - 'src/brainlayer/pause.py'
              - 'tests/test_fleet_watchdog.py'
              - '.github/workflows/ci.yml'

  swift:
    name: swift (macos-15)
    needs: changes
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6)
        if: needs.changes.outputs.brain_bar == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Python for the synthetic MCP wire client and helper formatter
        if: needs.changes.outputs.brain_bar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache SwiftPM
        if: needs.changes.outputs.brain_bar == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            brain-bar/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('brain-bar/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Build BrainBar
        if: needs.changes.outputs.brain_bar == 'true'
        run: |
          cd brain-bar
          swift build -c release
          python3 Tests/BrainBarTests/Scripts/check_release_transport_clock.py

      - name: Test BrainBar
        id: brainbar-tests
        if: needs.changes.outputs.brain_bar == 'true'
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        run: |
          python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "brainbar-test-start").write_text(str(time.time()))'
          cd brain-bar && python3 Tests/BrainBarTests/Scripts/run_swift_tests.py

      - name: Preserve native test crash reports
        if: failure() && steps.brainbar-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          started = float((temporary / "brainbar-test-start").read_text())
          destination = temporary / "brainbar-native-crashes"
          source = Path.home() / "Library/Logs/DiagnosticReports"
          for pattern in ("xctest*.ips", "xctest*.crash", "BrainBarPackageTests*.ips", "BrainBarPackageTests*.crash"):
              for report in source.glob(pattern):
                  if report.is_file() and not report.is_symlink() and report.stat().st_mtime >= started:
                      destination.mkdir(exist_ok=True)
                      shutil.copy2(report, destination / report.name)
          PY

      - name: Upload native test crash reports
        if: failure() && steps.brainbar-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: brainbar-native-crashes-${{ github.sha }}
          path: ${{ runner.temp }}/brainbar-native-crashes
          if-no-files-found: ignore

      - name: Skip BrainBar Swift build
        if: needs.changes.outputs.brain_bar != 'true'
        run: echo "no brain-bar changes — swift build/test skipped"

  launchd:
    # fleet-watchdog.sh reads the pause sentinel with plutil and BSD `date -j`, so those drills
    # skip themselves on the ubuntu matrix. This is the runner that actually executes them;
    # tests/test_fleet_watchdog.py asserts this job exists and runs that file.
    name: launchd (macos-15)
    needs: changes
    if: needs.changes.outputs.launchd == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The drills need pytest, pyyaml and stdlib-only brainlayer.pause off PYTHONPATH -- not
      # the full dev extra, which would pull torch onto a macOS runner for no benefit.
      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Fleet-watchdog and pause-sentinel drills
        env:
          PYTHONPATH: src
        run: pytest tests/test_fleet_watchdog.py -v --tb=short

  installed-import-gate:
    name: installed wheel imports (python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install and import every module and hook
        run: |
          set -euo pipefail
          wheel="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          scripts/installed_import_gate.sh "$wheel" "$GITHUB_WORKSPACE/hooks" "$RUNNER_TEMP/brainlayer-import-venv"
      - name: Prove an arbitrary missing transitive dependency fails the gate
        run: |
          set -euo pipefail
          wheel="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          venv="$RUNNER_TEMP/brainlayer-import-venv"
          urllib3_dir="$("$venv/bin/python" -I -c 'import pathlib, urllib3; print(pathlib.Path(urllib3.__file__).resolve().parent)')"
          poisoned="${urllib3_dir}.import-sweep-poisoned"
          mv "$urllib3_dir" "$poisoned"
          trap 'mv "$poisoned" "$urllib3_dir"' EXIT
          if output="$(cd "$RUNNER_TEMP" && "$venv/bin/python" -m brainlayer.import_sweep \
            --wheel "$wheel" --hooks-dir "$GITHUB_WORKSPACE/hooks" --timeout 60 --jobs 4 2>&1)"; then
            echo "::error::import sweep passed with urllib3 source removed"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "No module named 'urllib3'" <<<"$output"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free runner disk
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Cache pip
        uses: actions/cache@v4
        with:
          # Share HTTP downloads across interpreters; pip still selects compatible wheels.
          # Avoid four ~3 GiB copies evicting the ~510 MiB SwiftPM cache.
          path: ~/.cache/pip/http-v2
          key: ${{ runner.os }}-pip-downloads-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-downloads-v2-

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-large-en-v1.5-bge-m3

      - name: Install
        run: pip install -e ".[dev]"

      - name: Warm Hugging Face model cache
        run: |
          python - <<'PY'
          import time

          from huggingface_hub import snapshot_download

          model_ids = ["BAAI/bge-large-en-v1.5", "BAAI/bge-m3"]
          delays = [5, 15, 30]

          for model_id in model_ids:
              for attempt in range(1, len(delays) + 2):
                  try:
                      snapshot_download(repo_id=model_id)
                      print(f"Warmed Hugging Face cache for {model_id}")
                      break
                  except Exception as exc:
                      if attempt == len(delays) + 1:
                          print(f"::warning::Unable to warm Hugging Face cache for {model_id}: {exc!r}")
                          break
                      delay = delays[attempt - 1]
                      print(f"Unable to warm Hugging Face cache for {model_id} on attempt {attempt}; retrying in {delay}s: {exc!r}")
                      time.sleep(delay)
          PY

      - name: Unit tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >
          python scripts/ci/run_with_deadline.py --seconds 1800 --label ci-unit --
          pytest tests/ -v --tb=short --timeout=300 --timeout-method=thread -m "not integration and not live and not crash_sweep" -x
          --ignore=tests/test_eval_framework.py
          --ignore=tests/test_follow_up_rewrite.py
          --ignore=tests/test_prompt_classification.py

      - name: Doctor fixture gate
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >
          python scripts/ci/run_with_deadline.py --seconds 600 --label ci-doctor --
          pytest tests/test_doctor.py -v --tb=short --timeout=300 --timeout-method=thread

      - name: Isolated eval and hook routing tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >
          python scripts/ci/run_with_deadline.py --seconds 600 --label ci-isolated --
          pytest
          tests/test_eval_framework.py
          tests/test_follow_up_rewrite.py
          tests/test_prompt_classification.py
          -v --tb=short --timeout=300 --timeout-method=thread -x

      - name: MCP tool registration
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >
          python scripts/ci/run_with_deadline.py --seconds 600 --label ci-registration --
          pytest tests/test_think_recall_integration.py::TestMCPToolCount -v --tb=short --timeout=300 --timeout-method=thread

  crash-sweeps:
    name: crash sweeps
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require a successful policy decision
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SWEEPS_REQUIRED: ${{ needs.changes.outputs.crash_sweeps }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$SWEEPS_REQUIRED" in true|false) ;; *) exit 1 ;; esac

      - name: Skip exhaustive sweeps for this PR
        if: needs.changes.outputs.crash_sweeps == 'false'
        run: echo "No crash-sensitive changes or crash-sweep label; batch gate remains required."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.crash_sweeps == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.crash_sweeps == 'true'
        with:
          python-version: "3.13"

      - name: Free runner disk
        if: needs.changes.outputs.crash_sweeps == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Cache pip
        if: needs.changes.outputs.crash_sweeps == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip/http-v2
          key: ${{ runner.os }}-pip-downloads-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-downloads-v2-

      - name: Install crash test dependencies
        if: needs.changes.outputs.crash_sweeps == 'true'
        run: pip install -e ".[dev]" pytest-xdist

      # Old py3.13 completion intervals: first migration 5.5–13.1s/shard,
      # restart 10.6–20.1s, revert 6.9–18.5s. Observed maxima × all 128 shards
      # estimate 2245s serial; 2400s bounds this gate independently, while
      # xdist uses available CPUs. The unit job keeps its existing 1800s bound.
      - name: Exhaustive crash sweeps
        if: needs.changes.outputs.crash_sweeps == 'true'
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >
          python scripts/ci/run_with_deadline.py --seconds 2400 --label ci-crash-sweeps --
          pytest tests/ -v --tb=short --timeout=300 --timeout-method=thread -m crash_sweep
          -n auto --durations=0 --junitxml="$RUNNER_TEMP/crash-sweeps.xml"

      - name: Retain per-shard timings and complete coverage inventory
        if: always() && needs.changes.outputs.crash_sweeps == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crash-sweep-results-python-3.13
          path: ${{ runner.temp }}/crash-sweeps.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked docs.local files
        shell: bash
        run: |
          tracked_docs_local="$(git ls-files docs.local)"
          if [[ -n "$tracked_docs_local" ]]; then
            echo "::error::docs.local is ignored but contains tracked files:"
            printf '%s\n' "$tracked_docs_local"
            exit 1
          fi
          echo "No tracked files under docs.local/."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reject tracked privacy export files
        run: python scripts/check_tracked_privacy_exports.py

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}

      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
